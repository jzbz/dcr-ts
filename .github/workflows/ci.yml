name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Thresholds live in vitest.config.ts; this fails if coverage drops.
      - run: npm run coverage

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Both module formats must load and agree on what they export.
      - name: Check the published entry points resolve
        run: |
          node -e 'import("./dist/index.js").then(m => {
            const cjs = require("./dist/index.cjs");
            const esm = Object.keys(m).sort(), req = Object.keys(cjs).sort();
            if (esm.length === 0) throw new Error("ESM build exports nothing");
            if (JSON.stringify(esm) !== JSON.stringify(req)) {
              throw new Error("ESM and CJS export different symbols");
            }
            console.log(`both builds export ${esm.length} symbols`);
          })'
      - name: Show what would be published
        run: npm pack --dry-run
      # Only production dependencies gate the build. Those are what a consumer of
      # the published package actually installs; a CVE in the test runner or the
      # bundler never reaches them, and letting dev-tool advisories break CI on a
      # library trains people to ignore it. The full audit still runs, for
      # visibility, without failing.
      - name: Audit what consumers install
        run: npm audit --omit=dev --audit-level=high
      - name: Audit everything (informational)
        run: npm audit || true

  # The test fixture is ground truth generated from dcrd itself, so it is only
  # worth anything if it still matches what dcrd produces. Regenerate it and
  # fail on any diff: that catches both a fixture edited by hand and a dcrd
  # change that moves a byte format out from under the library.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: vectorgen/go.sum
      - name: Regenerate dcrd vectors
        working-directory: vectorgen
        run: go run . > ../test/fixtures/dcrd-vectors.json
      - name: Fail if the committed fixture has drifted
        run: git diff --exit-code -- test/fixtures/dcrd-vectors.json
